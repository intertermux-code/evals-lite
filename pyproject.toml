[project]
name = "evals-lite"
version = "0.2.0"
description = "Local-first LLM eval regression runner"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AP", email = "intertermux@gmail.com" }]
keywords = [
    "llm",
    "evals",
    "evaluation",
    "regression",
    "testing",
    "ci",
    "cost",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
evals = "evals.cli:main"

[project.urls]
Homepage = "https://github.com/intertermux-code/evals-lite"
Repository = "https://github.com/intertermux-code/evals-lite"
Issues = "https://github.com/intertermux-code/evals-lite/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evals*"]
